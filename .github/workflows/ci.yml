name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# TODO(M6): pin every action by commit SHA before the first public release.
jobs:
  test-goldengate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go test -race ./internal/goldengate/...

  test-goldengatebridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go test -race ./internal/goldengatebridge/...

  test-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go test -race ./internal/model/... ./internal/utils/... ./scripts/... ./cmd/...

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go test -race ./internal/tests/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect --no-banner --redact

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the server image (not pushed)
        run: docker build -f deploy/Dockerfile --build-arg VERSION=ci -t goldengatebridge:ci .
      - name: The image starts and answers
        run: |
          docker run -d --name bridge -p 8080:8080 -e GOLDENGATE_ADMIN_TOKEN="$(openssl rand -base64 32)" goldengatebridge:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/healthz
          docker run --rm goldengatebridge:ci version | grep -q ' ci '
